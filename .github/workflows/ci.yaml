name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint code
        run: bun run lint

      - name: Compile TypeScript
        run: bun run compile

      # Unit tests run without the extension host: `vscode` resolves to a stub.
      # Tests that need the protobuf-fhir corpus next door skip when it is
      # absent, which is always the case in CI -- they are a local guard, not a
      # CI one, and must never fail the build for being unable to find it.
      - name: Unit tests
        run: bun run test

      - name: Package extension
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'
